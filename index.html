<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>CrediTech - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.html" />
  </head>

  <body
    style="
      background: linear-gradient(135deg, #0a2a66, #1976d2);
      height: 100vh;
      display: flex;
      align-items: center;
    "
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <div class="card shadow">
            <div class="card-body" style="text-align: center">
              <img
                src="./img/logo.png"
                alt="Logo CrediTech"
                width="250"
                height="250"
              />

              <form>
                <div class="mb-3">
                  <label class="form-label">Usuario</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Ingrese usuario"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Ingrese contraseña"
                  />
                </div>

                <a href="dashboard.html" class="btn btn-primary w-100"
                  >Iniciar sesión</a
                >
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
