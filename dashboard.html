<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>CrediTech - Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <div
        style="width: 220px; height: 100vh; background: rgb(26, 163, 255)"
        class="text-white p-3"
      >
        <img
          src="./img/logo.png"
          alt="Logo CrediTech"
          width="200"
          height="200"
        />
        <hr />

        <a href="dashboard.html" class="nav-link text-white">🏠 Dashboard</a>
        <a href="clientes.html" class="nav-link text-white">👥 Clientes</a>
        <a href="creditos.html" class="nav-link text-white">💳 Créditos</a>
        <a href="pagos.html" class="nav-link text-white">💰 Pagos</a>
        <a href="index.html" class="nav-link text-danger">🚪 Cerrar sesión</a>
      </div>

      <!-- Contenido -->
      <div class="container-fluid p-4">
        <h2>Dashboard</h2>
        <div class="row mt-4">
          <div class="col-md-3">
            <div class="card text-bg-primary">
              <div class="card-body">
                <h5>Clientes</h5>
                <p>120 registrados</p>
              </div>
            </div>
          </div>

          <div class="col-md-3">
            <div class="card text-bg-success">
              <div class="card-body">
                <h5>Créditos aprobados</h5>
                <p>80</p>
              </div>
            </div>
          </div>

          <div class="col-md-3">
            <div class="card text-bg-warning">
              <div class="card-body">
                <h5>Créditos pendientes</h5>
                <p>25</p>
              </div>
            </div>
          </div>

          <div class="col-md-3">
            <div class="card text-bg-danger">
              <div class="card-body">
                <h5>Pagos atrasados</h5>
                <p>10</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
